<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Der Hain – Übersicht</title>
<!--
  youngbyyou.com/admin – die Adresse, die man sich merken kann.

  Diese Seite liegt auf GitHub Pages, und GitHub Pages kann nur Dateien
  ausliefern: kein Weiterreichen, kein Server, keine Anmeldung. Die Übersicht
  selbst muss aber dort laufen, wo die Daten liegen (im Hain-Worker) – sonst
  wären Seite und Zahlen zwei verschiedene Herkünfte, und der Browser würde
  jede Anfrage blockieren.

  Also führt diese Adresse dorthin, statt es vorzutäuschen. Drei Wege, damit
  keiner ins Leere läuft: die Weiterleitung im Kopf (auch ohne JavaScript),
  der Sprung per Skript (sofort, ohne Eintrag in der Zurück-Taste) und der
  sichtbare Knopf, falls beides abgeschaltet ist.

  Soll die Adresse eines Tages WIRKLICH hier wohnen, müsste youngbyyou.com
  hinter Cloudflare liegen – dann kann ein Worker sie durchreichen.
-->
<meta http-equiv="refresh" content="0; url=https://yby-grove.yby-circle-worker.workers.dev/admin">
<link rel="canonical" href="https://yby-grove.yby-circle-worker.workers.dev/admin">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #11302B 0%, #0B1A22 45%, #0A0E1A 100%) fixed, #0A0E1A;
    color: #F2F5FA;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 380px; max-width: 94vw; text-align: center;
    background: rgba(14,21,38,0.92); border: 1px solid #263150;
    border-radius: 18px; padding: 30px 24px;
  }
  .dot {
    width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 14px;
    background: radial-gradient(circle at 38% 32%, #7CE8CF, #4ADEC2 55%, #1E7A66);
  }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; }
  p { color: #9AA6C0; font-size: 13.5px; margin-top: 8px; }
  a.go {
    display: inline-block; margin-top: 18px; text-decoration: none;
    font-size: 13px; font-weight: 700;
    color: #06251d; background: #4ADEC2; border: 1px solid #4ADEC2;
    border-radius: 12px; padding: 10px 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Der Hain</h1>
    <p>Die Übersicht öffnet sich gleich. Sie liegt dort, wo die Zahlen liegen.</p>
    <a class="go" href="https://yby-grove.yby-circle-worker.workers.dev/admin">Jetzt öffnen</a>
  </div>
  <script>
    location.replace('https://yby-grove.yby-circle-worker.workers.dev/admin');
  </script>
</body>
</html>
