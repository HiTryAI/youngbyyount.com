<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Young by You – Ein gehaltener Tag. Ein Baum.</title>
<meta name="description" content="Kleine tägliche Routinen, die dich jung halten – und für jede gehaltene Serie wird ein echter Baum gepflanzt. Die ersten 14 Tage gehören dir.">
<meta property="og:title" content="Young by You – One day kept. One tree.">
<meta property="og:description" content="Small daily routines that keep you young — and every kept streak plants a real tree.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://youngbyyou.com/assets/og.jpg">
<meta name="theme-color" content="#e9ecec">
<link rel="canonical" href="https://youngbyyou.com/">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/app_icon.png">
<link rel="preconnect" href="https://yby-film.yby-circle-worker.workers.dev" crossorigin>
<style>
:root{
  --ink:#1d1a16;
  --ink-soft:rgba(29,26,22,.62);
  --paper:#e9ecec;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* ── Scroll driver ─────────────────────────────── */
/* 450 stills, one continuous camera flight */
#driver{height:1148vh}
/* ── Fixed film stage ──────────────────────────── */
/* Not `inset:0`. On a phone that is only the space between the toolbars, so
   the moment Safari shrinks its bottom bar the film is short and paper shows
   through. `100vh` on iOS already means the screen with the toolbars hidden —
   the film then sits behind them and there is never a gap. */
#stage{
  position:fixed;top:0;left:0;right:0;
  height:100vh;height:100lvh;
  overflow:hidden;
  transition:transform .7s cubic-bezier(.2,.7,.2,1);
  will-change:transform;
}
#film{position:absolute;inset:0;width:100%;height:100%;display:block}
/* while a panel is open the film holds still and steps back a little */
html.parked #stage{transform:scale(1.03)}
#dim{
  position:fixed;inset:0;z-index:24;opacity:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, rgba(8,10,12,.30), rgba(8,10,12,.62));
  transition:opacity .55s ease;
}
html.parked #dim{opacity:1}
/* ── Picture in picture: the app, running inside the film ── */
/* Four windows share this look. They alternate sides so no two chapters in a
   row put the phone in the same place.                                     */
.pipwin{
  position:fixed;z-index:15;opacity:0;visibility:hidden;pointer-events:none;
  height:36vh;width:20.25vh;                /* 9:16 → w = h * .5625 */
  top:34vh;
  will-change:transform,opacity;
}
.pipwin.right{right:6vw}
.pipwin.left{left:6vw}
.pipwin .shell{
  position:relative;width:100%;height:100%;
  background:linear-gradient(160deg,#2c3134,#0a0c0d 42%,#000 100%);
  border-radius:15%/7.6%;
  padding:1.6%;
  box-shadow:
    0 0 0 .5px rgba(255,255,255,.30),
    0 1px 2px rgba(255,255,255,.16) inset,
    0 26px 44px rgba(0,0,0,.34),
    0 60px 90px rgba(0,0,0,.26);
}
.pipwin canvas{
  display:block;width:100%;height:100%;
  border-radius:13.6%/6.6%;
  background:#0b0e10;
}
/* glass sheen over the screen */
.pipwin .shell::after{
  content:"";position:absolute;inset:0;border-radius:15%/7.6%;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 42%);
  mix-blend-mode:screen;
}
/* soft ground shadow so it floats instead of sticking on */
.pipwin .cast{
  position:absolute;left:8%;right:8%;bottom:-6%;height:12%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.42), rgba(0,0,0,0) 72%);
  filter:blur(6px);
}
.pipwin.wide{height:min(52vh,520px);width:min(29.25vh,292.5px);top:30vh}
.pipwin.wide.right{right:7vw}
.pipwin.wide.left{left:7vw}
/* ── Loader ────────────────────────────────────── */
#loader{
  position:fixed;inset:0;z-index:60;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  transition:opacity .9s ease, visibility .9s;
}
#loader.gone{opacity:0;visibility:hidden}
#loader .word{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
#loader .bar{width:120px;height:2px;background:rgba(29,26,22,.12);border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0%;background:var(--ink);border-radius:2px;transition:width .3s ease}
/* ── Language toggle ───────────────────────────── */
#lang{
  position:fixed;top:calc(env(safe-area-inset-top, 0px) + 16px);right:18px;z-index:50;
  display:flex;gap:2px;padding:3px;border-radius:99px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 1px 8px rgba(0,0,0,.06);
}
#lang button{
  border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink-soft);padding:5px 11px;border-radius:99px;cursor:pointer;letter-spacing:.04em;
}
#lang button.on{background:var(--ink);color:#fff}
/* ── Chapter rail ──────────────────────────────── */
/* The page is eleven screens long. Without this nobody knows that. */
#rail{
  position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;gap:14px;align-items:flex-end;
  opacity:0;transition:opacity .5s ease;pointer-events:none;
}
#rail.on{opacity:1;pointer-events:auto}
#rail button{
  border:0;background:transparent;padding:0;cursor:pointer;
  display:flex;align-items:center;gap:9px;color:var(--ink-soft);
}
#rail .dot{
  width:7px;height:7px;border-radius:50%;background:rgba(29,26,22,.26);
  box-shadow:0 0 0 3px rgba(255,255,255,.28);
  transition:transform .35s cubic-bezier(.2,.7,.2,1), background .35s ease;
}
#rail button.on .dot{background:var(--ink);transform:scale(1.65)}
#rail .tag{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  opacity:0;transform:translateX(6px);transition:opacity .3s ease, transform .3s ease;
  text-shadow:0 1px 10px rgba(233,236,236,.8);
}
#rail button:hover .tag,#rail button.on .tag{opacity:1;transform:none}
html.parked #rail{opacity:0;pointer-events:none}
/* ── Text cues ─────────────────────────────────── */
.cue{
  position:fixed;z-index:20;pointer-events:none;opacity:0;
  will-change:opacity,transform;
}
.cue h1,.cue h2{font-weight:700;letter-spacing:-.028em;line-height:1.04}
.cue .sub{font-weight:500;color:rgba(29,26,22,.9)}
/* A halo instead of a scrim, so nothing boxes the picture in. One wide glow
   was not enough: over sunlit grass the type dissolved into the texture. It
   takes a tight, near-opaque rim at the glyph edge plus the wide glow behind
   it — then dark type sits on light, whatever passes underneath. */
.cue h1,.cue h2,.cue .sub{
  text-shadow:
    0 0 1px rgba(240,242,242,.96),
    0 0 3px rgba(240,242,242,.92),
    0 0 9px rgba(240,242,242,.8),
    0 1px 24px rgba(240,242,242,.62);
}
/* headline words arrive one after another */
.cue h2 .w{
  display:inline-block;opacity:0;transform:translateY(15px);filter:blur(9px);
  transition:opacity .5s ease, transform .62s cubic-bezier(.2,.7,.2,1), filter .5s ease;
  transition-delay:calc(var(--i) * 45ms);
}
.cue.in h2 .w{opacity:1;transform:none;filter:none}
.cue .sub{opacity:0;transform:translateY(10px);transition:opacity .55s ease .18s, transform .6s cubic-bezier(.2,.7,.2,1) .18s}
.cue.in .sub{opacity:1;transform:none}
.cue .num{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
/* ── The symbol that opens a chapter's long text ── */
.sym{
  pointer-events:none;position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  width:52px;height:52px;margin-bottom:18px;
  border:0;padding:0;cursor:pointer;border-radius:50%;
  color:var(--ink);
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 26px rgba(0,0,0,.10),0 0 0 .5px rgba(255,255,255,.55) inset;
  opacity:0;transform:scale(.82);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease;
}
.cue.in .sym{opacity:1;transform:none}
.cue.live .sym{pointer-events:auto}
.sym:hover{box-shadow:0 1px 3px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.16),0 0 0 .5px rgba(255,255,255,.7) inset}
.sym:active{transform:scale(.94)}
/* the glyph breathes, not the button: a click target that never stops moving
   is a click target that is hard to hit */
.sym svg{width:27px;height:27px;overflow:visible}
.cue.in .sym svg{animation:breathe 4.2s ease-in-out 1.1s infinite}
.sym svg [data-draw]{
  stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len,120);stroke-dashoffset:var(--len,120);
}
.cue.in .sym svg [data-draw]{
  animation:draw .85s cubic-bezier(.3,.8,.3,1) forwards;
  animation-delay:calc(var(--d,0) * 1ms);
}
.sym svg [data-fade]{opacity:0;transition:opacity .4s ease}
.cue.in .sym svg [data-fade]{opacity:1;transition-delay:calc(var(--d,0) * 1ms + 520ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.sym .hint{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* intro — centered, top third */
#c-intro{left:0;right:0;top:16vh;text-align:center;padding:0 24px}
#c-intro .eyebrow{font-size:14px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
#c-intro h1{font-size:clamp(44px,7.2vw,96px)}
#c-intro .sub{font-size:clamp(18px,2.2vw,26px);margin-top:16px;letter-spacing:-.01em;opacity:1;transform:none}
/* scroll hint */
#c-hint{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center}
/* the first frames end in a sunlit path, so white here disappeared — ink with
   the same halo as the rest of the type reads on every one of them */
#c-hint span{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(29,26,22,.9);text-shadow:0 0 2px rgba(240,242,242,.95),0 0 8px rgba(240,242,242,.85),0 0 20px rgba(240,242,242,.6)}
#c-hint .chev{display:block;margin:10px auto 0;width:18px;height:18px;border-right:2px solid rgba(29,26,22,.85);border-bottom:2px solid rgba(29,26,22,.85);transform:rotate(45deg);animation:dip 1.8s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(240,242,242,.9))}
@keyframes dip{0%,100%{transform:translateY(0) rotate(45deg);opacity:.9}50%{transform:translateY(7px) rotate(45deg);opacity:.4}}
/* the five chapters — sides alternate, phone always opposite the copy */
/* Over sunlit grass the halo alone still lost: the texture there is the size
   of the letterforms. So each chapter carries its own light — one very wide,
   fully feathered pool that reads as sun on that side of the shot, never as
   a box. Over the pale sky it is the same colour as the sky and vanishes. */
.chapter{--gx:26%}
.chapter::before{
  content:"";position:absolute;z-index:-1;pointer-events:none;
  inset:-16% -22% -32% -22%;
  background:radial-gradient(76% 72% at var(--gx) 46%,
    rgba(237,240,240,.86) 0%, rgba(237,240,240,.64) 40%,
    rgba(237,240,240,.24) 68%, rgba(237,240,240,0) 84%);
}
#c-games,#c-kanal{--gx:74%}
#c-close{--gx:50%}
.chapter h2{font-size:clamp(29px,4.2vw,58px)}
.chapter .sub{font-size:clamp(15px,1.75vw,20px);margin-top:14px;line-height:1.5;color:rgba(29,26,22,.74)}
#c-routine{left:7vw;top:14vh;max-width:min(540px,44vw)}
#c-tree   {left:7vw;top:14vh;max-width:min(540px,44vw)}
#c-games  {right:7vw;top:14vh;max-width:min(540px,44vw)}
#c-kreis  {left:7vw;top:14vh;max-width:min(540px,44vw)}
#c-kanal  {right:7vw;top:14vh;max-width:min(540px,44vw)}
#c-close  {left:0;right:0;top:13vh;text-align:center;padding:0 24px}
#c-close h2{font-size:clamp(32px,4.8vw,66px)}
#c-close .sub{font-size:clamp(16px,1.9vw,22px);max-width:620px;margin-left:auto;margin-right:auto}
/* store button — a single badge at the very end of the page, no card */
#c-end{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16vh);text-align:center;padding:0 24px;pointer-events:none}
#c-end.live{pointer-events:auto}
#c-end .badge{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:#fff;border-radius:14px;padding:12px 22px;text-decoration:none;
  box-shadow:0 10px 30px rgba(0,0,0,.22);transition:transform .25s ease;
}
#c-end .badge:hover{transform:scale(1.03)}
#c-end .badge svg{width:22px;height:26px;flex:none}
#c-end .badge div{text-align:left;line-height:1.15}
#c-end .badge small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:.02em}
#c-end .badge strong{font-size:17px;font-weight:600;letter-spacing:-.01em}
#c-end .badge.soon{opacity:.92;cursor:default}
/* ── The panel behind a symbol ─────────────────── */
#panel{position:fixed;inset:0;z-index:70;display:flex;pointer-events:none}
#panel[hidden]{display:none}
#panel.on{pointer-events:auto}
#panel .sheet{
  margin-left:auto;width:min(520px,100%);height:100%;
  background:rgba(252,253,253,.88);
  backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:-30px 0 80px rgba(0,0,0,.22);
  display:flex;flex-direction:column;
  transform:translateX(46px);opacity:0;
  transition:transform .6s cubic-bezier(.2,.75,.2,1), opacity .45s ease;
}
#panel.on .sheet{transform:none;opacity:1}
#panel .top{
  display:flex;align-items:flex-start;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 34px) 34px 0 34px;
}
#panel .ico{
  width:52px;height:52px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink);
  background:rgba(29,26,22,.06);box-shadow:0 0 0 .5px rgba(29,26,22,.1) inset;
}
#panel .ico svg{width:27px;height:27px;overflow:visible}
#panel .ico svg [data-draw]{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#panel .ico svg [data-fade]{opacity:1}
#panel h3{font-size:clamp(25px,3vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.1;padding-top:6px}
#panel .close{
  margin-left:auto;flex:none;width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(29,26,22,.07);color:var(--ink);font-size:19px;line-height:1;
  transition:background .2s ease;
}
#panel .close:hover{background:rgba(29,26,22,.14)}
#panel .body{
  padding:24px 34px calc(env(safe-area-inset-bottom,0px) + 40px) 34px;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
#panel .body p{
  font-size:16.5px;line-height:1.62;color:rgba(29,26,22,.78);margin-bottom:17px;
  opacity:0;transform:translateY(12px);
  transition:opacity .5s ease, transform .55s cubic-bezier(.2,.7,.2,1);
  transition-delay:calc(var(--i) * 70ms + 180ms);
}
#panel.on .body p{opacity:1;transform:none}
#panel .body p:last-child{margin-bottom:0}
/* ── footer strip at the very end ──────────────── */
#foot{
  position:fixed;left:0;right:0;bottom:0;z-index:30;opacity:0;pointer-events:none;
  padding:34px 20px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;justify-content:center;gap:26px;
  font-size:12.5px;color:rgba(255,255,255,.88);
  text-shadow:0 1px 10px rgba(0,0,0,.5);
  background:linear-gradient(to top, rgba(0,0,0,.38), transparent);
  transition:opacity .5s ease;
}
#foot.on{opacity:1;pointer-events:auto}
#foot a{color:inherit;text-decoration:none}
#foot a:hover{color:#fff}
@media (max-width:900px){
  #panel .sheet{width:100%;margin-left:0;height:auto;margin-top:auto;max-height:86%;
    border-radius:26px 26px 0 0;transform:translateY(60px);
    box-shadow:0 -26px 70px rgba(0,0,0,.28)}
  #panel.on .sheet{transform:none}
  #panel .top{padding:26px 24px 0 24px}
  #panel .body{padding:20px 24px calc(env(safe-area-inset-bottom,0px) + 30px) 24px}
}
@media (max-width:640px){
  .chapter{left:24px;right:24px;top:11vh;max-width:none;text-align:left;--gx:32%}
  #c-games,#c-kanal,#c-close{--gx:32%}
  #c-close .sub{margin-left:0;margin-right:0}
  #c-intro{top:13vh}
  .sym{width:46px;height:46px;margin-bottom:14px}
  .sym svg{width:24px;height:24px}
  #rail{right:13px;gap:12px}
  #rail .tag{display:none}
  /* A phone screen has no room beside the copy — the words run the full
     width, so a window next to them ends up behind them. All four therefore
     stand below the text, on the right, where the thumb is. */
  .pipwin,.pipwin.wide{
    height:33vh;width:18.5625vh;             /* 9:16 */
    top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);
  }
  .pipwin.left,.pipwin.right,
  .pipwin.wide.left,.pipwin.wide.right{left:auto;right:7vw}
}
@media (prefers-reduced-motion:reduce){
  #c-hint .chev{animation:none}
  .cue.in .sym svg{animation:none}
  .cue h2 .w,.cue .sub,.sym{transition-duration:.01ms}
  .cue.in .sym svg [data-draw]{animation-duration:.01ms}
}
</style>
</head>
<body>

<div id="loader"><div class="word">Young by You</div><div class="bar"><i id="lbar"></i></div></div>

<div id="stage"><canvas id="film"></canvas></div>
<div id="dim"></div>

<!-- The app, playing in windows on top of the film — in the app's own tab
     order: Start, Spiele, Kreis, Kanal. -->
<div id="pip-home"  class="pipwin right" aria-hidden="true"><div class="shell"><canvas id="cv-home"></canvas><i class="cast"></i></div></div>
<div id="pip-games" class="pipwin left"  aria-hidden="true"><div class="shell"><canvas id="cv-games"></canvas><i class="cast"></i></div></div>
<div id="pip-kreis" class="pipwin right" aria-hidden="true"><div class="shell"><canvas id="cv-kreis"></canvas><i class="cast"></i></div></div>
<div id="pip-kanal" class="pipwin left"  aria-hidden="true"><div class="shell"><canvas id="cv-kanal"></canvas><i class="cast"></i></div></div>

<nav id="lang" aria-label="Sprache / Language">
  <button id="lang-de" onclick="setLang('de')">DE</button>
  <button id="lang-en" onclick="setLang('en')">EN</button>
</nav>

<nav id="rail" aria-label="Kapitel"></nav>

<!-- text cues, driven by scroll -->
<div class="cue" id="c-intro">
  <div class="eyebrow" data-t="eyebrow"></div>
  <h1>Young by You</h1>
  <div class="sub" data-t="intro_sub"></div>
</div>
<div class="cue" id="c-hint"><span data-t="hint"></span><i class="chev"></i></div>

<div class="cue chapter" id="c-routine">
  <button class="sym" data-panel="routine" type="button">
    <!-- the day's ring, closing -->
    <svg viewBox="0 0 30 30" aria-hidden="true">
      <circle data-draw cx="15" cy="15" r="10.5" style="--len:66;--d:0" transform="rotate(-90 15 15)"></circle>
      <circle data-fade cx="15" cy="4.5" r="2.4" fill="currentColor" style="--d:0"></circle>
    </svg>
    <span class="hint" data-t="more"></span>
  </button>
  <h2 data-t="routine_h"></h2>
  <div class="sub" data-t="routine_s"></div>
</div>

<div class="cue chapter" id="c-tree">
  <button class="sym" data-panel="tree" type="button">
    <!-- a sapling: the trunk grows, two branches, three leaves -->
    <svg viewBox="0 0 30 30" aria-hidden="true">
      <path data-draw d="M15 27V9" style="--len:18;--d:0"></path>
      <path data-draw d="M15 16C15 16 10 15 8.5 11" style="--len:13;--d:280"></path>
      <path data-draw d="M15 13C15 13 20 12 21.5 8" style="--len:13;--d:420"></path>
      <ellipse data-fade cx="15" cy="6.4" rx="3.4" ry="2.6" fill="currentColor" style="--d:300"></ellipse>
      <ellipse data-fade cx="7.4" cy="9.6" rx="2.6" ry="2" fill="currentColor" style="--d:420"></ellipse>
      <ellipse data-fade cx="22.6" cy="6.6" rx="2.6" ry="2" fill="currentColor" style="--d:540"></ellipse>
    </svg>
    <span class="hint" data-t="more"></span>
  </button>
  <h2 data-t="tree_h"></h2>
  <div class="sub" data-t="tree_s"></div>
</div>

<div class="cue chapter" id="c-games">
  <button class="sym" data-panel="games" type="button">
    <!-- the perfect circle, drawn freehand and not quite closing -->
    <svg viewBox="0 0 30 30" aria-hidden="true">
      <path data-draw style="--len:72;--d:0"

function fill(el, text, asWords){
  el.textContent = "";
  if(asWords){
    text.split(/\s+/).forEach((w, i)=>{
      const s = document.createElement("span");
      s.className = "w"; s.style.setProperty("--i", i); s.textContent = w;
      el.appendChild(s);
      el.appendChild(document.createTextNode(" "));
    });
    return;
  }
  for(const part of text.split(/(%\d+%)/)){
    if(!part) continue;

    if(m){
      const b = document.createElement("b");
      b.className = "num"; b.dataset.n = m[1]; b.textContent = "0";
      el.appendChild(b);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  }
}

/* ══════════ film ══════════ */
/* One film for every screen, and one continuous camera flight: the cliff runs
   into the house on the same clifftop, 450 stills at 12 per second, so the
   scroll moves the camera at one steady speed the whole way down. Portrait
   phones get the film pre-cut for their shape (tier "p", straight out of the
   4K master) instead of upscaling the wide frames — same picture, same pan,
   just sharp.

   The stills do not live in this repository. Two thousand files were more
   than GitHub Pages could publish — builds went from six minutes to failing —
   so they sit in R2 and a small worker hands them out. AVIF where the browser
   can read it (about half the bytes of the old JPEGs), and the small tier
   keeps a JPEG twin for the few that cannot.                               */
const FILM = "https://yby-film.yby-circle-worker.workers.dev";
const PORTRAIT = window.innerHeight/window.innerWidth >= 1.6 && window.innerWidth < 700;
const N     = 450;                  // the whole flight
const N_CH1 = 291;                  // where the cliff ends — load that part first
const canvas = document.getElementById("film");
const ctx = canvas.getContext("2d");
const dpr = Math.min(window.devicePixelRatio||1, 2);
const big = window.innerWidth >= 1024;
let TIER = PORTRAIT ? "p" : (big ? "l" : "s");
let EXT  = "avif";                  /* settled by the probe before anything loads */
const imgs = new Array(N+1);
let loadedCount = 0, loaderGone = false;

function pad(i){ return String(i).padStart(3,"0"); }
function src(i){ return FILM + "/f/" + TIER + "/f_" + pad(i) + "." + EXT; }

/* Can this browser read AVIF? Everything since Safari 16 can; the ones that
   cannot get the JPEG twin, which only exists for the small tier — a slightly
   softer film beats no film. Decided once, before the first request, so no
   frame is ever fetched twice.                                             */
function avifReady(){
  return new Promise(done=>{
    const im = new Image();
    im.onload  = ()=> done(im.width > 0);
    im.onerror = ()=> done(false);
    im.src = "data:image/avif;base64,AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAAD5bWV0YQAAAAAAAAAvaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAFBpY3R1cmVIYW5kbGVyAAAAAA5waXRtAAAAAAABAAAAHmlsb2MAAAAARAAAAQABAAAAAQAAASEAAAAbAAAAKGlpbmYAAAAAAAEAAAAaaW5mZQIAAAAAAQAAYXYwMUNvbG9yAAAAAGppcHJwAAAAS2lwY28AAAAUaXNwZQAAAAAAAAACAAAAAgAAABBwaXhpAAAAAAMICAgAAAAMYXYxQ4EADAAAAAATY29scm5jbHgAAgACAAIAAAAAF2lwbWEAAAAAAAAAAQABBAECgwQAAAAjbWRhdAoJAgAABUAxq+QBMg4QANwA88eeEAAQAbl2TQ==";
  });
}
function load(i, cb){
  const have = imgs[i];
  if(have){
    if(have.complete && have.naturalWidth){ if(cb) cb(); }
    else if(cb) have.addEventListener("load", cb, {once:true});
    return;
  }
  const im = new Image();
  im.crossOrigin = "anonymous";          /* keeps the canvas readable */
  im.addEventListener("load", ()=>{ loadedCount++; tickLoader(); repaintIfCurrent(i); });
  if(cb) im.addEventListener("load", cb, {once:true});
  im.src = src(i);
  imgs[i] = im;
}
function tier(step, from, to, then){
  let pending = 0, done = false;
  for(let i=from;i<=to;i+=step){
    if(!imgs[i] || !imgs[i].complete){ pending++;
      load(i, ()=>{ if(--pending===0 && !done){ done=true; then&&then(); } });
    }
  }
  if(pending===0 && !done){ done=true; then&&then(); }
}
function tickLoader(){
  const bar = document.getElementById("lbar");
  if(bar) bar.style.width = Math.min(100, loadedCount/25*100) + "%";
}
/* coarse → medium → full, the cliff first so the curtain lifts fast; the
   house follows one density behind, long before anyone scrolls that far */
avifReady().then(ok=>{
  if(!ok){ TIER = "s"; EXT = "jpg"; }   /* the twin tier, the only one in JPEG */
  load(1, ()=> paint(true));
  tier(12, 1, N_CH1, ()=>{
    hideLoader();
    tier(12, N_CH1+1, N, ()=>{
      tier(3, 1, N_CH1, ()=>{
        windows[0].start(); windows[1].start();
        tier(3, N_CH1+1, N, ()=>{
          windows[2].start(); windows[3].start();
          tier(1, 1, N_CH1, ()=> tier(1, N_CH1+1, N));
        });
      });
    });
  });
});
setTimeout(hideLoader, 6000);       /* never trap the visitor */
function hideLoader(){
  if(loaderGone) return; loaderGone = true;
  document.getElementById("loader").classList.add("gone");
  document.getElementById("rail").classList.add("on");
}
function nearest(i){
  if(imgs[i] && imgs[i].complete && imgs[i].naturalWidth) return imgs[i];
  for(let d=1; d<N; d++){
    const a=i-d, b=i+d;
    if(a>=1 && imgs[a] && imgs[a].complete && imgs[a].naturalWidth) return imgs[a];
    if(b<=N && imgs[b] && imgs[b].complete && imgs[b].naturalWidth) return imgs[b];
  }
  return null;
}

/* focal point keeps the phone in frame on narrow screens; the portrait
   frames already have this pan baked in, so they stay centred */
const FOCUS = [[1,.58],[42,.5],[58,.45],[110,.46],[140,.48],[170,.5],[291,.5],[450,.5]];
function focusX(f){
  if(PORTRAIT) return .5;
  for(let k=0;k<FOCUS.length-1;k++){
    const [f0,x0]=FOCUS[k], [f1,x1]=FOCUS[k+1];
    if(f>=f0 && f<=f1) return x0 + (x1-x0)*(f-f0)/(f1-f0);
  }
  return .5;
}

/* The canvas takes its size from the stage's own box, never from
   window.innerHeight — those two are not the same number on a phone, and an
   inline height beats the stylesheet, which is how a gap gets in. */
const stage = document.getElementById("stage");
let cw=0, ch=0;
function resize(){
  const r = stage.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if(!w || !h) return;
  if(w === cw && h === ch) return;
  cw = w; ch = h;
  canvas.width = Math.round(cw*dpr); canvas.height = Math.round(ch*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  paint(true);
  windows.forEach(w=> w.refit());
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=> setTimeout(resize, 320));
/* Safari grows the page when it collapses its toolbars and does not always
   fire `resize` for it — the observer catches every one of those. */
if(window.ResizeObserver) new ResizeObserver(()=> resize()).observe(stage);
if(window.visualViewport) window.visualViewport.addEventListener("resize", resize);

let shownFrame = 1, targetFrame = 1, painted = -1;
function paint(force){
  const f = Math.round(shownFrame);
  if(!force && f===painted) return;
  const im = nearest(f);
  if(!im) return;
  const s = Math.max(cw/im.naturalWidth, ch/im.naturalHeight);
  const dw = im.naturalWidth*s, dh = im.naturalHeight*s;
  let ox = cw/2 - focusX(f)*dw;
  ox = Math.min(0, Math.max(cw-dw, ox));
  const oy = (ch-dh)/2;
  ctx.drawImage(im, ox, oy, dw, dh);
  painted = f;
}
function repaintIfCurrent(i){ if(Math.abs(i-Math.round(shownFrame))<6) paint(true); }

/* ── the strips the page can never paint on ─────────────────────────────
   No web page may draw into the iOS status bar, so the film cannot reach it,
   and a pale strip above and below a dark film reads as two white bars.

   Measured in Safari 26 rather than assumed: `theme-color` is ignored there,
   the `html` background is ignored, and the strips take the **body's**
   background — a solid colour only (a gradient falls back to white) — and
   they follow it live. So the body colour is repainted from the film itself:
   samples along the film's top edge and along the edge the visitor can
   actually see at the bottom, quantised so it only changes when the picture
   does. theme-color is kept in step for the browsers that do read it.
   A tainted canvas just keeps the colour it started with.                   */
const themeMeta = document.querySelector('meta[name="theme-color"]');
let themeLast = "";
function syncTheme(){
  if(!loaderGone || !cw || !ch) return;
  /* Safari tints both strips with the same colour, so it has to be chosen.
     The top strip sits directly against the picture with nothing in between —
     a seam there is glaring. The bottom strip is a toolbar with its own shape
     and controls, and reads as furniture whatever colour it is. So the top
     edge counts double. */
  const yTop = Math.round(3*dpr);
  const yBot = Math.round((Math.min(ch, window.innerHeight) - 4) * dpr);
  let r=0, g=0, b=0, n=0;
  try{
    for(const [y, weight] of [[yTop, 2], [yBot, 1]]){
      if(y < 0 || y >= canvas.height) continue;
      for(const fx of [0.2, 0.5, 0.8]){
        const d = ctx.getImageData(Math.round(cw*fx*dpr), y, 1, 1).data;
        if(d[3] < 200) return;               /* nothing painted there yet */
        r += d[0]*weight; g += d[1]*weight; b += d[2]*weight; n += weight;
      }
    }
  }catch(e){ return; }                       /* tainted canvas — leave it be */
  if(!n) return;
  /* Safari does not use the colour raw — it tones it down by roughly a third
     before painting its chrome (measured: #e00000 came back as rgb 167,0,0).
     Handing it a correspondingly brighter colour lands the strip on the film
     instead of a shade under it. */
  const k = (parked ? 0.55 : 1) * 1.32;
  /* clamp AFTER the rounding, not before: 255 quantised up to 256 is "100",
     which turns the whole string into an eight-digit hex — over the brightest
     frame of the film that painted the strips near-black. */
  const hex = "#" + [r/n, g/n, b/n]
    .map(v => Math.min(255, Math.round(Math.min(255, v*k)/4)*4).toString(16).padStart(2,"0"))
    .join("");
  if(hex === themeLast) return;
  themeLast = hex;
  document.body.style.backgroundColor = hex;
  if(themeMeta) themeMeta.setAttribute("content", hex);
}
setInterval(syncTheme, 250);

/* ══════════ the phone windows ══════════ */
/* Scroll animations riding on top of the film, driven by the same scroll.
   Four windows, one factory — in the app's own tab order: Start, Spiele,
   Kreis, Kanal. Each owns its images, its canvas and its marks; nothing is
   shared but the code.                                                     */
const PIP_N = 60;
/* p_001 of two of the four clips is a leftover from an earlier render — it
   shows different seed data and pops. Every clip therefore starts at 2. */
const PIP_1 = 2;
function smooth(t){ return t<=0?0 : t>=1?1 : t*t*(3-2*t); }

/* marks are main-film frames:
   a,b = fade in · pa,pb = the little clip runs · c,d = fade out            */
function phoneWindow(elId, canvasId, dir, marks){
  const el   = document.getElementById(elId);
  const cv   = document.getElementById(canvasId);
  const cx   = cv.getContext("2d");
  const pics = new Array(PIP_N+1);
  let started = false, drawn = -1, visible = false;
  if(!PORTRAIT) el.classList.add("wide");
  const mid  = (marks.a + marks.d) / 2;
  const lean = el.classList.contains("left") ? -1 : 1;

  function get(i){
    if(pics[i]) return;
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.addEventListener("load", ()=>{ if(i===drawn) draw(i, true); });
    im.src = FILM + "/w/" + dir + "/p_" + pad(i) + "." + EXT;
    pics[i] = im;
  }
  function start(){
    if(started) return; started = true;
    for(let i=PIP_1;i<=PIP_N;i+=5) get(i);               /* coarse first */
    setTimeout(()=>{ for(let i=PIP_1;i<=PIP_N;i++) get(i); }, 700);
  }
  function size(){
    const w = cv.offsetWidth, h = cv.offsetHeight;
    if(!w || !h) return;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
    drawn = -1;
  }
  function near(i){
    if(pics[i] && pics[i].complete && pics[i].naturalWidth) return i;
    for(let d=1; d<PIP_N; d++){
      const a=i-d, b=i+d;
      if(a>=PIP_1 && pics[a] && pics[a].complete && pics[a].naturalWidth) return a;
      if(b<=PIP_N && pics[b] && pics[b].complete && pics[b].naturalWidth) return b;
    }
    return 0;
  }
  function draw(i, force){
    const j = near(i);
    if(!j) return false;
    if(!force && j===drawn) return true;
    const im = pics[j], w = cv.offsetWidth, h = cv.offsetHeight;
    const s = Math.max(w/im.naturalWidth, h/im.naturalHeight);
    cx.drawImage(im, (w-im.naturalWidth*s)/2, 0, im.naturalWidth*s, im.naturalHeight*s);
    drawn = j;
    return true;
  }
  function style(f){
    if(!started && f > marks.a - 55) start();
    const rise = smooth((f-marks.a)/(marks.b-marks.a));
    const fall = 1 - smooth((f-marks.c)/(marks.d-marks.c));
    const o = Math.min(rise, fall);
    if(o <= 0.002){
      if(visible){ el.style.opacity = 0; el.style.visibility = "hidden"; visible = false; }
      return;
    }
    /* the clip position — same scroll, its own little timeline */
    const t = Math.min(1, Math.max(0, (f-marks.pa)/(marks.pb-marks.pa)));
    if(!near(PIP_1)) return;                             /* nothing loaded yet */
    if(!visible){ el.style.visibility = "visible"; visible = true; size(); }
    draw(Math.round(PIP_1 + t*(PIP_N-PIP_1)));
    const sc  = 0.88 + 0.12*rise - 0.04*(1-fall);
    const par = -18 * Math.min(1, Math.max(0, (f-marks.a)/(marks.d-marks.a)));
    const y   = (1-rise)*54 - (1-fall)*30 + par;
    /* a degree and a half of lean, following the flight — enough that the
       phone sits IN the shot instead of on top of it */
    const rot = lean * 3 * ((f - mid) / (marks.d - marks.a));
    el.style.opacity = o.toFixed(3);
    el.style.transform =
      "translate3d(0," + y.toFixed(1) + "px,0) scale(" + sc.toFixed(4) + ") " +
      "rotate(" + rot.toFixed(2) + "deg)";
  }
  /* a resize changes the canvas' pixel size — redraw whatever is on screen */
  function refit(){ if(visible){ size(); draw(drawn>0?drawn:PIP_1, true); } }

  return {start, style, refit};
}

/* The Start window rides with the tree chapter: that screen carries both the
   routines and the growing tree, so it is the picture that chapter argues
   for. Between frame 40 and 110 the film already holds a real phone in a real
   hand, which is why the routines chapter itself stays clean.               */
const windows = [
  phoneWindow("pip-home",  "cv-home",  "home",  {a:126, b:138, pa:134, pb:170, c:170, d:182}),
  phoneWindow("pip-games", "cv-games", "games", {a:196, b:208, pa:204, pb:244, c:244, d:256}),
  phoneWindow("pip-kreis", "cv-kreis", "kreis", {a:274, b:286, pa:282, pb:322, c:322, d:334}),
  phoneWindow("pip-kanal", "cv-kanal", "kanal", {a:350, b:362, pa:358, pb:390, c:390, d:402}),
];

/* ══════════ scroll → frame + cues ══════════ */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function progress(){
  const max = document.body.scrollHeight - window.innerHeight;
  return max>0 ? Math.min(1, Math.max(0, window.scrollY/max)) : 0;
}
/* film runs over the first 95.3% of the scroll, then rests on the last frame */
function frameFor(p){ return 1 + Math.min(1, p/0.953)*(N-1); }
function scrollForFrame(f){
  const max = document.body.scrollHeight - window.innerHeight;
  return max * ((f-1)/(N-1)) * 0.953;
}

const cues = [
  {el:"c-intro",   a:-9,  b:-6,  c:16,  d:30},
  {el:"c-hint",    a:-9,  b:-6,  c:5,   d:12},
  {el:"c-routine", a:40,  b:52,  c:100, d:112},
  {el:"c-tree",    a:124, b:136, c:168, d:180},
  {el:"c-games",   a:190, b:202, c:246, d:258},
  {el:"c-kreis",   a:268, b:280, c:324, d:336},
  {el:"c-kanal",   a:344, b:356, c:392, d:404},
  {el:"c-close",   a:414, b:426, c:9999,d:9999},
];
const cueEls = {}; cues.forEach(c=> cueEls[c.el]=document.getElementById(c.el));
let numCache = {};

function styleCues(f){
  for(const c of cues){
    const el = cueEls[c.el];
    const rise = smooth((f-c.a)/Math.max(1,c.b-c.a));
    const fall = 1 - smooth((f-c.c)/Math.max(1,c.d-c.c));
    const o = Math.min(rise, fall);
    el.style.opacity = o.toFixed(3);
    el.style.transform = "translateY(" + ((1-fall)*-14).toFixed(1) + "px)";
    el.classList.toggle("in",   rise > 0.12 && fall > 0.05);
    el.classList.toggle("live", o > 0.6);
    /* numbers count up with the chapter, and back down on the way out */
    const list = numCache[c.el] || (numCache[c.el] = el.querySelectorAll(".num"));
    for(const b of list){
      const v = Math.round(+b.dataset.n * rise);
      if(b.textContent !== String(v)) b.textContent = v;
    }
  }
  styleEnd();
  styleRail(f);
}
/* The store button belongs at the very end of the page, not inside the film.
   The film rests on its last frame over the final stretch of scroll, so this
   one is driven by the scroll itself, not by a frame number.               */
const endEl = document.getElementById("c-end");
function styleEnd(){
  const p = progress();
  const o = smooth((p-0.958)/0.030);
  endEl.style.opacity = o.toFixed(3);
  endEl.style.transform = "translateY(" + ((1-o)*22).toFixed(1) + "px)";
  endEl.classList.toggle("live", o>0.5);
  document.getElementById("foot").classList.toggle("on", p>0.972);
}

/* ══════════ chapter rail ══════════ */
/* Eleven screens of scroll with no idea how far it goes is a bad feeling.
   Five dots fix that, and they double as a way to jump.                    */
const RAIL = [
  {cue:"c-routine", f: 56},
  {cue:"c-tree",    f:140},
  {cue:"c-games",   f:206},
  {cue:"c-kreis",   f:284},
  {cue:"c-kanal",   f:360},
];
function buildRail(){
  const rail = document.getElementById("rail");
  rail.textContent = "";
  RAIL.forEach((r, i)=>{
    const b = document.createElement("button");
    b.type = "button";
    const tag = document.createElement("span"); tag.className = "tag";
    tag.textContent = T[lang].rail[i];
    const dot = document.createElement("i"); dot.className = "dot";
    b.appendChild(tag); b.appendChild(dot);
    b.setAttribute("aria-label", T[lang].rail[i]);
    b.addEventListener("click", ()=>{
      if(parked) closePanel();
      window.scrollTo({top: scrollForFrame(r.f), behavior: reduce ? "auto" : "smooth"});
    });
    rail.appendChild(b);
  });
}
function styleRail(f){
  const rail = document.getElementById("rail");
  if(!rail.children.length) return;
  let active = -1;
  RAIL.forEach((r, i)=>{
    const c = cues.find(x=> x.el === r.cue);
    if(c && f >= c.a && f <= c.d) active = i;
  });
  for(let i=0;i<rail.children.length;i++){
    rail.children[i].classList.toggle("on", i === active);
  }
}

/* ══════════ the panel: the film parks, the text arrives ══════════ */
/* The scroll IS the film's clock. A panel that opened while the page kept
   scrolling would drag the camera along behind the reader and feel broken.
   Opening one therefore stops the film exactly where it stands — a
   deliberate pause, not an accident — and closing hands the scroll back.   */
const panel     = document.getElementById("panel");
const panelBody = document.getElementById("panel-body");
const panelH    = document.getElementById("panel-h");
const panelIco  = document.getElementById("panel-ico");
let parked = false, parkedFrame = 1, openKey = null, lastFocus = null;

function renderPanel(key){
  const P = T[lang].panels[key];
  if(!P) return;
  panelH.textContent = P.h;
  panelBody.textContent = "";
  P.p.forEach((t, i)=>{
    const p = document.createElement("p");
    p.style.setProperty("--i", i);
    p.textContent = t;
    panelBody.appendChild(p);
  });
  const svg = document.querySelector('.sym[data-panel="'+key+'"] svg');
  panelIco.textContent = "";
  if(svg) panelIco.appendChild(svg.cloneNode(true));
}
function openPanel(key){
  if(parked) return;
  parkedFrame = shownFrame;
  parked = true;
  openKey = key;
  renderPanel(key);
  panel.hidden = false;
  document.documentElement.classList.add("parked");
  requestAnimationFrame(()=> panel.classList.add("on"));
  lastFocus = document.activeElement;
  setTimeout(()=> document.getElementById("panel-x").focus(), 60);
}
function closePanel(){
  if(!parked) return;
  panel.classList.remove("on");
  document.documentElement.classList.remove("parked");
  parked = false; openKey = null;
  setTimeout(()=>{ if(!parked) panel.hidden = true; }, 620);
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.querySelectorAll(".sym").forEach(b=>{
  b.addEventListener("click", ()=> openPanel(b.dataset.panel));
});
document.getElementById("panel-x").addEventListener("click", closePanel);
panel.addEventListener("click", e=>{ if(e.target === panel) closePanel(); });

/* While parked the page must not move under the panel. The sheet's own text
   still scrolls; `overscroll-behavior: contain` keeps that from spilling.  */
function holdScroll(e){
  if(!parked) return;
  if(panelBody.contains(e.target)) return;
  e.preventDefault();
}
window.addEventListener("wheel", holdScroll, {passive:false});
window.addEventListener("touchmove", holdScroll, {passive:false});
window.addEventListener("keydown", e=>{
  if(e.key === "Escape" && parked){ closePanel(); return; }
  if(!parked) return;
  if([" ","PageDown","PageUp","ArrowDown","ArrowUp","Home","End"].includes(e.key)) e.preventDefault();
});

/* ══════════ the loop ══════════ */
function loop(){
  targetFrame = parked ? parkedFrame : frameFor(progress());
  shownFrame = reduce ? targetFrame
             : shownFrame + (targetFrame-shownFrame)*0.16;
  if(Math.abs(targetFrame-shownFrame)<0.05) shownFrame = targetFrame;
  paint();
  styleCues(shownFrame);
  for(const w of windows) w.style(shownFrame);
  requestAnimationFrame(loop);
}
setLang(lang);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
